name: Hugo, theme, and Cloudflare maintenance

on:
  schedule:
    - cron: "0 4 1 */6 *"
  workflow_dispatch:

concurrency:
  group: infrastructure-maintenance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js for Mana theme maintenance
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Read pinned Hugo version
        id: hugo-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          version="${{ steps.hugo-version.outputs.version }}"
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-current"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/gohugoio/hugo/releases/download/v${version}/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo-current" hugo
          chmod +x "$RUNNER_TEMP/hugo-current/hugo"
          echo "$RUNNER_TEMP/hugo-current" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo-current/hugo" version

      - name: Run infrastructure unit tests
        run: python -m unittest discover -s tools/maintenance -p "test_*.py"

      - name: Discover and prepare Hugo and Mana theme updates
        id: updates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/maintenance/infrastructure_maintenance.py --apply-updates > infra-result.json
          status=$?
          cat infra-result.json
          exit $status

      - name: Install and validate selected Hugo and theme candidates
        id: validation
        if: steps.updates.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          version="$(tr -d '\r\n' < .hugo-version)"
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/hugo-selected"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/gohugoio/hugo/releases/download/v${version}/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" hugo
          chmod +x "$install_dir/hugo"
          "$install_dir/hugo" version
          "$install_dir/hugo" --minify

          if test -f themes/mana/package-lock.json; then
            npm --prefix themes/mana ci --ignore-scripts
            npm --prefix themes/mana run format:check
          fi

          python tools/maintenance/validate_infrastructure_changes.py

      - name: Commit validated infrastructure updates
        id: commit
        if: steps.updates.outcome == 'success' && steps.validation.outcome == 'success'
        shell: bash
        run: |
          git config user.name "compilemymind-infrastructure[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .maintenance/reports .hugo-version README.md themes/mana/package.json
          if test -e themes/mana/package-lock.json || git ls-files --error-unmatch themes/mana/package-lock.json >/dev/null 2>&1; then
            git add --all -- themes/mana/package-lock.json
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hugo and Mana theme are already current."
            exit 0
          fi
          git commit -m "chore(infra): update Hugo and Mana theme"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Synchronize Hugo version with Cloudflare Pages
        if: steps.updates.outcome == 'success' && steps.validation.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PAGES_PROJECT != ''
        run: python tools/maintenance/sync_cloudflare_hugo.py

      - name: Report incomplete Cloudflare configuration
        if: steps.updates.outcome == 'success' && steps.validation.outcome == 'success' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_PAGES_PROJECT == '')
        run: echo "Hugo and theme validation passed; Cloudflare synchronization was skipped because its settings are incomplete."

      - name: Upload infrastructure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-maintenance-${{ github.run_id }}
          path: |
            infra-result.json
            .maintenance/reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail after an unsuccessful infrastructure update
        if: always() && (steps.updates.outcome == 'failure' || steps.validation.outcome == 'failure')
        run: exit 1
