<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Software architecture connects goals to a running system</title>
  <desc id="desc">Business goals and quality requirements guide application boundaries. The application depends on databases, cache, identity, and external services to deliver safe change and reliable operation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172d"/>
      <stop offset="1" stop-color="#123d45"/>
    </linearGradient>
    <linearGradient id="architecture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#5eead4"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#background)"/>
  <text x="64" y="62" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Architecture connects intent to implementation</text>
  <text x="64" y="98" font-family="Inter,Arial,sans-serif" font-size="18" fill="#b8dce0">Boundaries and relationships turn requirements into a system the team can change and operate.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="300" height="174" rx="20" fill="#ffffff"/>
    <text x="92" y="184" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">1. Goals and constraints</text>
    <text x="92" y="220" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">• User and business outcomes</text>
    <text x="92" y="250" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">• Budget, team, and deadline</text>
    <text x="92" y="280" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">• Regulation and existing systems</text>

    <rect x="64" y="365" width="300" height="198" rx="20" fill="#fef3c7"/>
    <text x="92" y="404" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#422006">2. Quality requirements</text>
    <text x="92" y="442" font-family="Inter,Arial,sans-serif" font-size="16" fill="#713f12">Reliability • Security • Speed</text>
    <text x="92" y="474" font-family="Inter,Arial,sans-serif" font-size="16" fill="#713f12">Scale • Maintainability • Cost</text>
    <rect x="92" y="505" width="242" height="34" rx="9" fill="#fde68a"/>
    <text x="213" y="528" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#78350f">Make important targets measurable</text>
  </g>

  <path d="M364 232 H430" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M364 464 H430" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="450" y="145" width="490" height="418" rx="24" fill="url(#architecture)" stroke="#67e8f9" stroke-width="2"/>
    <text x="482" y="188" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">3. Boundaries and relationships</text>
    <text x="482" y="220" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">One deployable application can still have strong internal boundaries.</text>

    <rect x="482" y="258" width="426" height="64" rx="14" fill="#ffffff"/>
    <text x="695" y="298" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Web and API boundary</text>

    <rect x="482" y="350" width="126" height="92" rx="14" fill="#ccfbf1"/>
    <text x="545" y="389" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">Catalog</text>
    <text x="545" y="416" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#115e59">products + price</text>

    <rect x="632" y="350" width="126" height="92" rx="14" fill="#dbeafe"/>
    <text x="695" y="389" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Ordering</text>
    <text x="695" y="416" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#1e40af">cart + workflow</text>

    <rect x="782" y="350" width="126" height="92" rx="14" fill="#ede9fe"/>
    <text x="845" y="389" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Inventory</text>
    <text x="845" y="416" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6">stock ownership</text>

    <path d="M608 396 H620 M758 396 H770" stroke="#0f766e" stroke-width="3" stroke-dasharray="6 5"/>

    <rect x="482" y="474" width="426" height="58" rx="14" fill="#0f172a"/>
    <text x="695" y="510" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Stable interfaces • explicit ownership • observable failures</text>
  </g>

  <path d="M940 354 H982" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="998" y="145" width="138" height="418" rx="22" fill="#ffffff"/>
    <text x="1067" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">4. Runtime</text>

    <rect x="1018" y="224" width="98" height="55" rx="12" fill="#dbeafe"/>
    <text x="1067" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1e3a8a">Database</text>
    <rect x="1018" y="300" width="98" height="55" rx="12" fill="#ccfbf1"/>
    <text x="1067" y="334" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#115e59">Cache</text>
    <rect x="1018" y="376" width="98" height="55" rx="12" fill="#ede9fe"/>
    <text x="1067" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b21b6">Identity</text>
    <rect x="1018" y="452" width="98" height="74" rx="12" fill="#fee2e2"/>
    <text x="1067" y="482" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#991b1b">External</text>
    <text x="1067" y="505" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#991b1b">services</text>
  </g>

  <rect x="180" y="624" width="840" height="82" rx="20" fill="#ffffff" fill-opacity=".09" stroke="#5b8790"/>
  <text x="600" y="658" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Outcome: safer change + predictable operation</text>
  <text x="600" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b8dce0">The best architecture is the simplest one that satisfies the important requirements.</text>
</svg>
