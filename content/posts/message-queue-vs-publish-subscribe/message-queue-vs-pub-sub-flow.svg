<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" role="img" aria-labelledby="title desc">
  <title id="title">Message queue and publish-subscribe routing compared</title>
  <desc id="desc">The upper panel shows one message queue delivering each task to one of three competing workers. The lower panel shows one topic copying an order event to inventory, billing, and analytics subscriptions, with workers sharing load inside each subscription.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="1" stop-color="#18264a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .heading { font: 700 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .panel-title { font: 700 23px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .label { font: 650 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .note { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #dbeafe; }
      .box { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .worker { fill: #0f766e; stroke: #5eead4; stroke-width: 2; rx: 12; }
      .subscription { fill: #713f12; stroke: #fbbf24; stroke-width: 2; rx: 12; }
      .line-blue { fill: none; stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrowBlue); }
      .line-amber { fill: none; stroke: #fbbf24; stroke-width: 3; marker-end: url(#arrowAmber); }
    </style>
  </defs>

  <rect width="900" height="880" rx="24" fill="url(#bg)"/>
  <text x="450" y="48" text-anchor="middle" class="heading">One message, two routing decisions</text>

  <rect x="35" y="75" width="830" height="330" rx="20" fill="#0f1d3b" stroke="#334155" stroke-width="2"/>
  <text x="65" y="112" class="panel-title">Message queue: divide one job</text>
  <text x="65" y="140" class="small">One task is owned by one interchangeable worker.</text>

  <rect x="65" y="184" width="145" height="76" class="box" filter="url(#shadow)"/>
  <text x="137.5" y="216" text-anchor="middle" class="label">Producer</text>
  <text x="137.5" y="239" text-anchor="middle" class="small">Generate label</text>

  <path d="M210 222 H300" class="line-blue"/>
  <rect x="305" y="174" width="190" height="96" class="box" filter="url(#shadow)"/>
  <text x="400" y="211" text-anchor="middle" class="label">Work queue</text>
  <text x="400" y="236" text-anchor="middle" class="small">one shared backlog</text>
  <circle cx="343" cy="250" r="7" fill="#38bdf8"/>
  <circle cx="365" cy="250" r="7" fill="#38bdf8"/>
  <circle cx="387" cy="250" r="7" fill="#38bdf8"/>

  <path d="M495 222 H555 V185 H610" class="line-blue"/>
  <path d="M555 222 H610" class="line-blue"/>
  <path d="M555 222 V259 H610" class="line-blue"/>
  <rect x="615" y="157" width="175" height="55" class="worker"/>
  <rect x="615" y="220" width="175" height="55" class="worker"/>
  <rect x="615" y="283" width="175" height="55" class="worker"/>
  <text x="702.5" y="190" text-anchor="middle" class="label">Worker A</text>
  <text x="702.5" y="253" text-anchor="middle" class="label">Worker B</text>
  <text x="702.5" y="316" text-anchor="middle" class="label">Worker C</text>
  <text x="450" y="376" text-anchor="middle" class="note">One message → one worker in the pool</text>

  <rect x="35" y="430" width="830" height="410" rx="20" fill="#1e1a17" stroke="#475569" stroke-width="2"/>
  <text x="65" y="467" class="panel-title">Publish-subscribe: copy one event</text>
  <text x="65" y="495" class="small">Every independent subscription gets its own delivery.</text>

  <rect x="65" y="555" width="145" height="76" class="box" filter="url(#shadow)"/>
  <text x="137.5" y="587" text-anchor="middle" class="label">Publisher</text>
  <text x="137.5" y="610" text-anchor="middle" class="small">Order created</text>
  <path d="M210 593 H285" class="line-amber"/>

  <rect x="290" y="545" width="170" height="96" class="subscription" filter="url(#shadow)"/>
  <text x="375" y="582" text-anchor="middle" class="label">Topic</text>
  <text x="375" y="607" text-anchor="middle" class="small">order.created</text>

  <path d="M460 593 H510 V535 H555" class="line-amber"/>
  <path d="M510 593 H555" class="line-amber"/>
  <path d="M510 593 V651 H555" class="line-amber"/>

  <rect x="560" y="505" width="245" height="62" class="subscription"/>
  <rect x="560" y="576" width="245" height="62" class="subscription"/>
  <rect x="560" y="647" width="245" height="62" class="subscription"/>
  <text x="682.5" y="532" text-anchor="middle" class="label">Inventory subscription</text>
  <text x="682.5" y="553" text-anchor="middle" class="small">worker A or B reserves stock</text>
  <text x="682.5" y="603" text-anchor="middle" class="label">Billing subscription</text>
  <text x="682.5" y="624" text-anchor="middle" class="small">worker A or B creates invoice</text>
  <text x="682.5" y="674" text-anchor="middle" class="label">Analytics subscription</text>
  <text x="682.5" y="695" text-anchor="middle" class="small">worker A or B records sale</text>

  <text x="450" y="762" text-anchor="middle" class="note">One message → one copy per subscription</text>
  <text x="450" y="793" text-anchor="middle" class="small">Workers may still compete inside each subscription.</text>
</svg>
