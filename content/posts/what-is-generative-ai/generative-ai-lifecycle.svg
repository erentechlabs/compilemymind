<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" role="img" aria-labelledby="title desc">
  <title id="title">Generative AI training and inference lifecycle</title>
  <desc id="desc">A vertical diagram showing training examples shaping model parameters, then a separate inference path where a prompt conditions the model, sampling creates a draft, and evidence and human review verify the result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .section { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 1.5px; }
      .label { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="960" height="920" rx="28" fill="#f8fafc"/>
  <text x="480" y="54" text-anchor="middle" class="heading">How generative AI moves from examples to output</text>

  <text x="64" y="102" class="section">TRAINING</text>
  <rect x="64" y="126" width="250" height="128" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="189" y="166" text-anchor="middle" class="label">Training examples</text>
  <text x="189" y="198" text-anchor="middle" class="body">text · images · audio · code</text>
  <text x="189" y="228" text-anchor="middle" class="small">curated into a training dataset</text>

  <path d="M 314 190 L 370 190" class="arrow"/>

  <rect x="374" y="126" width="250" height="128" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="499" y="166" text-anchor="middle" class="label">Optimization</text>
  <text x="499" y="195" text-anchor="middle" class="body">adjust parameters</text>
  <text x="499" y="220" text-anchor="middle" class="body">to reduce error</text>
  <text x="499" y="244" text-anchor="middle" class="small">learn statistical patterns</text>

  <path d="M 624 190 L 680 190" class="arrow"/>

  <rect x="684" y="126" width="212" height="128" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="790" y="166" text-anchor="middle" class="label">Trained model</text>
  <text x="790" y="198" text-anchor="middle" class="body">patterns encoded</text>
  <text x="790" y="228" text-anchor="middle" class="small">in numerical parameters</text>

  <line x1="64" y1="300" x2="896" y2="300" class="dash"/>
  <text x="64" y="342" class="section">INFERENCE</text>

  <rect x="64" y="360" width="238" height="128" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="183" y="407" text-anchor="middle" class="label">Prompt + context</text>
  <text x="183" y="434" text-anchor="middle" class="body">instructions · files</text>
  <text x="183" y="459" text-anchor="middle" class="body">retrieved facts</text>
  <text x="183" y="478" text-anchor="middle" class="small">for this request</text>

  <path d="M 302 424 L 366 424" class="arrow"/>

  <rect x="370" y="360" width="260" height="128" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="407" text-anchor="middle" class="label">Conditioned model</text>
  <text x="500" y="434" text-anchor="middle" class="body">computes plausible</text>
  <text x="500" y="459" text-anchor="middle" class="body">continuations</text>
  <text x="500" y="478" text-anchor="middle" class="small">without full retraining</text>

  <path d="M 790 254 L 790 320 L 500 320 L 500 366" class="arrow"/>

  <path d="M 630 424 L 694 424" class="arrow"/>

  <rect x="698" y="350" width="198" height="148" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="797" y="390" text-anchor="middle" class="label">Sampling</text>
  <text x="797" y="422" text-anchor="middle" class="body">choose among</text>
  <text x="797" y="448" text-anchor="middle" class="body">plausible outputs</text>
  <text x="797" y="478" text-anchor="middle" class="small">variation is expected</text>

  <path d="M 797 498 L 797 548" class="arrow"/>

  <rect x="168" y="570" width="270" height="132" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="303" y="610" text-anchor="middle" class="label">Text path</text>
  <text x="303" y="642" text-anchor="middle" class="body">predict a token, append it,</text>
  <text x="303" y="670" text-anchor="middle" class="body">then predict the next token</text>

  <rect x="522" y="570" width="270" height="132" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="657" y="610" text-anchor="middle" class="label">Diffusion image path</text>
  <text x="657" y="642" text-anchor="middle" class="body">start with noise, then</text>
  <text x="657" y="670" text-anchor="middle" class="body">denoise in learned steps</text>

  <path d="M 797 548 L 303 548 L 303 568" class="arrow"/>
  <path d="M 797 548 L 657 548 L 657 568" class="arrow"/>

  <path d="M 303 702 L 303 748 L 470 748 L 470 778" class="arrow"/>
  <path d="M 657 702 L 657 748 L 490 748 L 490 778" class="arrow"/>

  <rect x="224" y="782" width="512" height="104" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="480" y="822" text-anchor="middle" class="label">Draft output — not automatic proof</text>
  <text x="480" y="854" text-anchor="middle" class="body">ground with evidence · test · apply controls · review impact</text>
</svg>
