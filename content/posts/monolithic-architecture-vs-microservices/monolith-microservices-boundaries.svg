<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">Monolithic architecture compared with microservices</title>
  <desc id="desc">A monolith contains four modules and one database inside a single deployment boundary. A microservices system has independently deployed services, service-owned data, network calls, and a shared operational platform. The diagram compares the boundaries each architecture creates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#155e75"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .boundary { fill: #f1f5f9; stroke: #475569; stroke-width: 2; stroke-dasharray: 8 6; }
      .module { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .service { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .data { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .ops { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .accent { fill: #ecfeff; stroke: #155e75; stroke-width: 2; }
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 16px system-ui, sans-serif; fill: #334155; }
      .tiny { font: 600 14px system-ui, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #155e75; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="760" height="980" rx="24"/>
  <text class="title" x="380" y="48" text-anchor="middle">Where each architecture draws the boundary</text>

  <rect class="panel" x="30" y="76" width="700" height="350" rx="20"/>
  <text class="heading" x="55" y="112">Modular monolith</text>
  <text class="small" x="55" y="138">One deployable application; internal modules stay explicit</text>
  <rect class="boundary" x="55" y="158" width="650" height="238" rx="16"/>
  <text class="tiny" x="75" y="184">ONE DEPLOYMENT AND PROCESS BOUNDARY</text>

  <rect class="module" x="75" y="205" width="135" height="58" rx="10"/>
  <text class="label" x="142.5" y="240" text-anchor="middle">Catalog</text>
  <rect class="module" x="225" y="205" width="135" height="58" rx="10"/>
  <text class="label" x="292.5" y="240" text-anchor="middle">Ordering</text>
  <rect class="module" x="375" y="205" width="135" height="58" rx="10"/>
  <text class="label" x="442.5" y="240" text-anchor="middle">Inventory</text>
  <rect class="module" x="525" y="205" width="155" height="58" rx="10"/>
  <text class="label" x="602.5" y="240" text-anchor="middle">Payments</text>

  <path class="arrow" d="M210 234 H222"/>
  <path class="arrow" d="M360 234 H372"/>
  <path class="arrow" d="M510 234 H522"/>
  <text class="tiny" x="380" y="289" text-anchor="middle">in-process calls • one release • local transactions</text>

  <rect class="data" x="210" y="311" width="340" height="58" rx="12"/>
  <text class="label" x="380" y="337" text-anchor="middle">Shared application database</text>
  <text class="tiny" x="380" y="357" text-anchor="middle">access controlled through module rules</text>

  <rect class="panel" x="30" y="450" width="700" height="390" rx="20"/>
  <text class="heading" x="55" y="486">Microservices</text>
  <text class="small" x="55" y="512">Independent deployment boundaries connected by the network</text>

  <rect class="boundary" x="55" y="536" width="150" height="194" rx="16"/>
  <text class="tiny" x="130" y="558" text-anchor="middle">DEPLOY</text>
  <rect class="service" x="70" y="575" width="120" height="54" rx="10"/>
  <text class="label" x="130" y="608" text-anchor="middle">Catalog</text>
  <rect class="data" x="85" y="655" width="90" height="48" rx="10"/>
  <text class="small" x="130" y="685" text-anchor="middle">Data</text>

  <rect class="boundary" x="220" y="536" width="150" height="194" rx="16"/>
  <text class="tiny" x="295" y="558" text-anchor="middle">DEPLOY</text>
  <rect class="service" x="235" y="575" width="120" height="54" rx="10"/>
  <text class="label" x="295" y="608" text-anchor="middle">Ordering</text>
  <rect class="data" x="250" y="655" width="90" height="48" rx="10"/>
  <text class="small" x="295" y="685" text-anchor="middle">Data</text>

  <rect class="boundary" x="385" y="536" width="150" height="194" rx="16"/>
  <text class="tiny" x="460" y="558" text-anchor="middle">DEPLOY</text>
  <rect class="service" x="400" y="575" width="120" height="54" rx="10"/>
  <text class="label" x="460" y="608" text-anchor="middle">Inventory</text>
  <rect class="data" x="415" y="655" width="90" height="48" rx="10"/>
  <text class="small" x="460" y="685" text-anchor="middle">Data</text>

  <rect class="boundary" x="550" y="536" width="155" height="194" rx="16"/>
  <text class="tiny" x="627.5" y="558" text-anchor="middle">DEPLOY</text>
  <rect class="service" x="565" y="575" width="125" height="54" rx="10"/>
  <text class="label" x="627.5" y="608" text-anchor="middle">Payments</text>
  <rect class="data" x="582.5" y="655" width="90" height="48" rx="10"/>
  <text class="small" x="627.5" y="685" text-anchor="middle">Data</text>

  <path class="arrow" d="M205 608 H232"/>
  <path class="arrow" d="M370 608 H397"/>
  <path class="arrow" d="M535 608 H562"/>
  <text class="tiny" x="380" y="754" text-anchor="middle">network contracts • partial failures • distributed data</text>

  <rect class="ops" x="90" y="776" width="580" height="42" rx="10"/>
  <text class="small" x="380" y="803" text-anchor="middle">Shared platform: delivery, identity, telemetry, recovery</text>

  <rect class="accent" x="30" y="865" width="700" height="82" rx="16"/>
  <text class="label" x="380" y="897" text-anchor="middle">Split when a capability needs real independence</text>
  <text class="small" x="380" y="925" text-anchor="middle">deployment • ownership • scaling • security • failure isolation</text>
</svg>
