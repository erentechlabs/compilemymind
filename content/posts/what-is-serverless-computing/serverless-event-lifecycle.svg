<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">Serverless event-to-execution lifecycle</title>
  <desc id="desc">Requests, queue messages, schedules, and file uploads enter a managed event router. The serverless platform starts or reuses elastic execution environments, which run application code and write durable state to managed services. The provider manages routing, capacity, and hosts while the application team owns code, permissions, data, and failure handling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="760" height="980" rx="30" fill="url(#bg)"/>
  <text x="380" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">From event to temporary execution</text>
  <text x="380" y="85" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">The platform manages capacity; your code manages the outcome.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="52" y="135" font-size="14" font-weight="700" letter-spacing="1.6" fill="#64748b">EVENT SOURCES</text>
    <g filter="url(#shadow)">
      <rect x="52" y="157" width="154" height="80" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="220" y="157" width="154" height="80" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="388" y="157" width="154" height="80" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="556" y="157" width="152" height="80" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    </g>
    <circle cx="129" cy="185" r="10" fill="#06b6d4"/>
    <circle cx="297" cy="185" r="10" fill="#06b6d4"/>
    <circle cx="465" cy="185" r="10" fill="#06b6d4"/>
    <circle cx="632" cy="185" r="10" fill="#06b6d4"/>
    <text x="129" y="218" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">HTTP request</text>
    <text x="297" y="218" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Queue message</text>
    <text x="465" y="218" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Schedule</text>
    <text x="632" y="218" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">File upload</text>

    <path d="M129 248 V276 H380 V310" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M297 248 V276" fill="none" stroke="#4f46e5" stroke-width="3"/>
    <path d="M465 248 V276" fill="none" stroke="#4f46e5" stroke-width="3"/>
    <path d="M632 248 V276 H380" fill="none" stroke="#4f46e5" stroke-width="3"/>

    <rect x="52" y="320" width="656" height="190" rx="24" fill="url(#platform)" filter="url(#shadow)"/>
    <text x="82" y="358" font-size="14" font-weight="700" letter-spacing="1.6" fill="#c7d2fe">PROVIDER-MANAGED PLATFORM</text>
    <rect x="82" y="382" width="596" height="96" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#a5b4fc"/>
    <text x="380" y="416" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Event router + scaling control</text>
    <text x="380" y="446" text-anchor="middle" font-size="16" fill="#e0e7ff">Match trigger · choose capacity · start or reuse an environment</text>
    <text x="380" y="470" text-anchor="middle" font-size="15" fill="#c7d2fe">Hosts, runtime maintenance, and instance replacement stay below this line</text>

    <path d="M380 510 V548" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="52" y="566" font-size="14" font-weight="700" letter-spacing="1.6" fill="#64748b">ELASTIC EXECUTION</text>
    <g filter="url(#shadow)">
      <rect x="52" y="590" width="204" height="142" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
      <rect x="278" y="590" width="204" height="142" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
      <rect x="504" y="590" width="204" height="142" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    </g>
    <text x="154" y="626" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Environment A</text>
    <text x="380" y="626" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Environment B</text>
    <text x="606" y="626" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Environment N</text>
    <text x="154" y="660" text-anchor="middle" font-size="16" fill="#334155">Validate event</text>
    <text x="380" y="660" text-anchor="middle" font-size="16" fill="#334155">Run business logic</text>
    <text x="606" y="660" text-anchor="middle" font-size="16" fill="#334155">Handle retry safely</text>
    <text x="154" y="697" text-anchor="middle" font-size="14" fill="#64748b">temporary</text>
    <text x="380" y="697" text-anchor="middle" font-size="14" fill="#64748b">replaceable</text>
    <text x="606" y="697" text-anchor="middle" font-size="14" fill="#64748b">limited by quotas</text>

    <path d="M380 732 V770" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="52" y="782" width="656" height="116" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
    <text x="380" y="818" text-anchor="middle" font-size="21" font-weight="700" fill="#164e63">Durable managed services</text>
    <text x="380" y="850" text-anchor="middle" font-size="16" fill="#155e75">Database · object storage · queue · identity · secrets · observability</text>
    <text x="380" y="876" text-anchor="middle" font-size="15" fill="#0e7490">State survives even when execution capacity scales down</text>

    <rect x="52" y="926" width="656" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="76" cy="944" r="7" fill="#4f46e5"/>
    <text x="94" y="950" font-size="14" font-weight="600" fill="#334155">You own:</text>
    <text x="170" y="950" font-size="14" fill="#475569">code, permissions, data, idempotency, limits, monitoring, and cost controls</text>
  </g>
</svg>
