<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">OSI seven-layer model and TCP/IP mapping</title>
  <desc id="desc">Seven horizontal OSI layers show their main responsibility and examples. A bracket on the right maps layers five through seven to the Internet application layer, layer four to transport, layer three to Internet, and layers one and two to link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#102b3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="940" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">How the seven OSI layers divide network communication</text>
  <text x="64" y="108" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Send downward to signals • receive upward to application meaning</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(64 150)">
      <rect width="790" height="92" rx="16" fill="#5b21b6"/>
      <rect width="92" height="92" rx="16" fill="#4c1d95"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">7</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Application</text>
      <text x="118" y="68" fill="#ede9fe" font-size="17">Network services used by applications</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">HTTP • DNS • SMTP • SSH</text>
    </g>
    <g transform="translate(64 250)">
      <rect width="790" height="92" rx="16" fill="#6d28d9"/>
      <rect width="92" height="92" rx="16" fill="#5b21b6"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">6</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Presentation</text>
      <text x="118" y="68" fill="#ede9fe" font-size="17">Representation and transformation</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">encoding • serialization • encryption</text>
    </g>
    <g transform="translate(64 350)">
      <rect width="790" height="92" rx="16" fill="#7c3aed"/>
      <rect width="92" height="92" rx="16" fill="#6d28d9"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">5</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Session</text>
      <text x="118" y="68" fill="#ede9fe" font-size="17">Conversation control and synchronization</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">setup • dialogue • checkpoints</text>
    </g>
    <g transform="translate(64 450)">
      <rect width="790" height="92" rx="16" fill="#0369a1"/>
      <rect width="92" height="92" rx="16" fill="#075985"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">4</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Transport</text>
      <text x="118" y="68" fill="#e0f2fe" font-size="17">End-to-end application delivery</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">TCP • UDP • ports</text>
    </g>
    <g transform="translate(64 550)">
      <rect width="790" height="92" rx="16" fill="#0e7490"/>
      <rect width="92" height="92" rx="16" fill="#155e75"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">3</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Network</text>
      <text x="118" y="68" fill="#cffafe" font-size="17">Addressing and routing between networks</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">IP • ICMP • routers • packets</text>
    </g>
    <g transform="translate(64 650)">
      <rect width="790" height="92" rx="16" fill="#0f766e"/>
      <rect width="92" height="92" rx="16" fill="#115e59"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">2</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Data Link</text>
      <text x="118" y="68" fill="#ccfbf1" font-size="17">Delivery across the current local link</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">frames • MAC • switches • VLANs</text>
    </g>
    <g transform="translate(64 750)">
      <rect width="790" height="92" rx="16" fill="#047857"/>
      <rect width="92" height="92" rx="16" fill="#065f46"/>
      <text x="46" y="57" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">1</text>
      <text x="118" y="38" fill="#fff" font-size="24" font-weight="700">Physical</text>
      <text x="118" y="68" fill="#d1fae5" font-size="17">Signals and bits across the medium</text>
      <text x="758" y="55" fill="#fff" font-size="17" text-anchor="end">copper • fiber • radio • bits</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="995" y="136" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Internet suite</text>
    <path d="M882 160 h-16 v282 h16" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    <rect x="902" y="244" width="188" height="96" rx="18" fill="#312e81" stroke="#c4b5fd" stroke-width="2"/>
    <text x="996" y="284" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Application</text>
    <text x="996" y="313" fill="#ddd6fe" font-size="15" text-anchor="middle">combines OSI 5–7</text>

    <path d="M882 460 h-16 v82 h16" fill="none" stroke="#7dd3fc" stroke-width="4"/>
    <rect x="902" y="459" width="188" height="82" rx="18" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="2"/>
    <text x="996" y="509" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Transport</text>

    <path d="M882 560 h-16 v82 h16" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <rect x="902" y="559" width="188" height="82" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="996" y="609" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Internet</text>

    <path d="M882 660 h-16 v182 h16" fill="none" stroke="#5eead4" stroke-width="4"/>
    <rect x="902" y="709" width="188" height="82" rx="18" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
    <text x="996" y="759" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Link</text>

    <line x1="190" y1="882" x2="720" y2="882" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="64" y="890" fill="#bae6fd" font-size="18">encapsulation</text>
    <text x="446" y="920" fill="#cbd5e1" font-size="16" text-anchor="middle">message → transport data → packet → frame → bits</text>
  </g>
</svg>
