<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Cache-aside read, refresh, and invalidation</title>
  <desc id="desc">A request checks the cache. Hits return quickly; misses are coalesced, loaded from the source of truth, cached with jitter, and returned. Writes commit before invalidating.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b20"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#67e8f9"/></marker>
    <marker id="w" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#fb7185"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#ecfeff">Cache-aside is a freshness contract</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#a5f3fc">The source of truth owns correctness. The cache is a disposable, observable copy.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="210" width="178" height="94" rx="20" fill="#ecfeff"/>
    <text x="153" y="251" text-anchor="middle" font-size="21" font-weight="700" fill="#083344">Request</text>
    <text x="153" y="278" text-anchor="middle" font-size="15" fill="#155e75">stable key</text>

    <rect x="330" y="190" width="220" height="134" rx="20" fill="#cffafe"/>
    <text x="440" y="239" text-anchor="middle" font-size="24" font-weight="700" fill="#083344">Cache</text>
    <text x="440" y="273" text-anchor="middle" font-size="15" fill="#155e75">value + expiry</text>
    <text x="440" y="298" text-anchor="middle" font-size="15" fill="#155e75">metrics + limits</text>

    <rect x="680" y="190" width="225" height="134" rx="20" fill="#fef3c7"/>
    <text x="793" y="239" text-anchor="middle" font-size="24" font-weight="700" fill="#422006">Miss control</text>
    <text x="793" y="273" text-anchor="middle" font-size="15" fill="#713f12">coalesce requests</text>
    <text x="793" y="298" text-anchor="middle" font-size="15" fill="#713f12">bound origin load</text>

    <rect x="980" y="190" width="158" height="134" rx="20" fill="#dcfce7"/>
    <text x="1059" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">Origin</text>
    <text x="1059" y="273" text-anchor="middle" font-size="15" fill="#166534">source of truth</text>
  </g>

  <path d="M242 257 H315" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
  <path d="M550 257 H665" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
  <path d="M905 257 H965" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
  <text x="607" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#fde68a">MISS</text>

  <path d="M440 324 V396 H153 V319" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
  <text x="294" y="383" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#67e8f9">HIT: RETURN COPY</text>
  <path d="M1059 324 V410 H440 V339" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
  <text x="750" y="400" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#67e8f9">STORE WITH TTL + JITTER</text>

  <rect x="64" y="500" width="1074" height="116" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#5d98a3"/>
  <text x="96" y="539" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fda4af">WRITE PATH</text>
  <text x="96" y="579" font-family="Inter,Arial,sans-serif" font-size="21" fill="#f8fafc">Commit origin → publish durable invalidation → delete/version cache key</text>
  <path d="M985 478 C860 450 602 460 478 492" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#w)"/>
  <text x="750" y="466" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#fda4af">STALE COPY MUST BE BOUNDED</text>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#a5f3fc">Design the outage path before the cache becomes production load-bearing infrastructure.</text>
</svg>
