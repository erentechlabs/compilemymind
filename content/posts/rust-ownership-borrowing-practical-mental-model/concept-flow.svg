<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Rust ownership and borrowing</title>
  <desc id="desc">One owner controls a value. The owner can grant multiple shared borrows or one exclusive mutable borrow. The value is dropped when its owner leaves scope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18120f"/><stop offset="1" stop-color="#59321f"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#fdba74"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff7ed">Rust tracks responsibility, access, and lifetime</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#fed7aa">A reference borrows access. It never becomes responsible for dropping the value.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="195" width="244" height="180" rx="24" fill="#ffedd5"/>
    <text x="186" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">ONE OWNER</text>
    <text x="186" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#431407">String</text>
    <text x="186" y="330" text-anchor="middle" font-size="15" fill="#7c2d12">drops the allocation</text>

    <rect x="425" y="158" width="312" height="252" rx="24" fill="#e0e7ff"/>
    <text x="581" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">CHOOSE ONE ACCESS MODE</text>
    <rect x="457" y="236" width="118" height="116" rx="16" fill="#c7d2fe"/>
    <text x="516" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#312e81">&amp;T</text>
    <text x="516" y="306" text-anchor="middle" font-size="14" fill="#4338ca">many shared</text>
    <text x="516" y="330" text-anchor="middle" font-size="14" fill="#4338ca">readers</text>
    <text x="600" y="299" text-anchor="middle" font-size="24" font-weight="700" fill="#64748b">OR</text>
    <rect x="618" y="236" width="87" height="116" rx="16" fill="#fecdd3"/>
    <text x="662" y="274" text-anchor="middle" font-size="22" font-weight="700" fill="#9f1239">&amp;mut T</text>
    <text x="662" y="306" text-anchor="middle" font-size="14" fill="#be123c">one</text>
    <text x="662" y="330" text-anchor="middle" font-size="14" fill="#be123c">writer</text>

    <rect x="860" y="195" width="274" height="180" rx="24" fill="#dcfce7"/>
    <text x="997" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">BORROWED VIEW</text>
    <text x="997" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#14532d">&amp;str / &amp;[T]</text>
    <text x="997" y="330" text-anchor="middle" font-size="15" fill="#166534">cannot outlive the owner</text>
  </g>

  <path d="M308 285 H410" stroke="#fdba74" stroke-width="5" marker-end="url(#a)"/>
  <path d="M737 285 H845" stroke="#fdba74" stroke-width="5" marker-end="url(#a)"/>

  <rect x="64" y="482" width="1070" height="120" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#9b6a50"/>
  <text x="96" y="525" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fdba74">END OF OWNER'S SCOPE</text>
  <text x="96" y="568" font-family="Inter,Arial,sans-serif" font-size="23" fill="#fff7ed">drop(value) · all borrows must already be finished</text>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#fed7aa">Moves transfer ownership. clone() creates independent owned data. Lifetime annotations describe relationships.</text>
</svg>
