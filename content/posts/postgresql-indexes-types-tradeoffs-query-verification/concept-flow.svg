<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">PostgreSQL index selection and verification</title>
  <desc id="desc">Start from a real query and operator, select an index access method, test with EXPLAIN ANALYZE and buffers on representative data, then measure read and write results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182a"/><stop offset="1" stop-color="#123864"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#93c5fd"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#eff6ff">An index is a workload hypothesis</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#bfdbfe">Match the operator, test the plan, then measure the whole workload.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="180" width="238" height="180" rx="22" fill="#eff6ff"/>
    <text x="183" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">1 · REAL QUERY</text>
    <text x="94" y="266" font-size="16" fill="#172554">WHERE tenant_id = ?</text>
    <text x="94" y="298" font-size="16" fill="#172554">created_at &gt; ?</text>
    <text x="94" y="330" font-size="16" fill="#172554">ORDER BY ... LIMIT</text>

    <rect x="366" y="160" width="340" height="220" rx="22" fill="#ecfeff"/>
    <text x="536" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#0e7490">2 · ACCESS METHOD</text>
    <g font-size="15" text-anchor="middle">
      <rect x="398" y="233" width="82" height="48" rx="10" fill="#bae6fd"/><text x="439" y="263" fill="#0c4a6e">B-tree</text>
      <rect x="493" y="233" width="82" height="48" rx="10" fill="#bae6fd"/><text x="534" y="263" fill="#0c4a6e">GIN</text>
      <rect x="588" y="233" width="82" height="48" rx="10" fill="#bae6fd"/><text x="629" y="263" fill="#0c4a6e">GiST</text>
      <rect x="445" y="301" width="82" height="48" rx="10" fill="#bae6fd"/><text x="486" y="331" fill="#0c4a6e">BRIN</text>
      <rect x="540" y="301" width="82" height="48" rx="10" fill="#bae6fd"/><text x="581" y="331" fill="#0c4a6e">SP-GiST</text>
    </g>

    <rect x="770" y="180" width="364" height="180" rx="22" fill="#fef3c7"/>
    <text x="952" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">3 · EXECUTION EVIDENCE</text>
    <text x="808" y="268" font-size="17" font-weight="700" fill="#422006">EXPLAIN (ANALYZE, BUFFERS)</text>
    <text x="808" y="302" font-size="15" fill="#713f12">estimated vs actual rows</text>
    <text x="808" y="330" font-size="15" fill="#713f12">I/O · sort · loops · time</text>
  </g>

  <path d="M302 270 H351" stroke="#93c5fd" stroke-width="5" marker-end="url(#a)"/>
  <path d="M706 270 H755" stroke="#93c5fd" stroke-width="5" marker-end="url(#a)"/>

  <rect x="64" y="470" width="1070" height="132" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#5c86b0"/>
  <text x="96" y="512" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#93c5fd">4 · PRODUCTION DECISION</text>
  <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#f8fafc">
    <text x="96" y="553">✓ lower p95 read latency</text>
    <text x="406" y="553">✓ acceptable write overhead</text>
    <text x="748" y="553">✓ real idx_scan usage</text>
    <text x="96" y="582">✓ representative data</text>
    <text x="406" y="582">✓ no redundant index</text>
    <text x="748" y="582">✓ monitored size and I/O</text>
  </g>
  <path d="M952 360 V455" stroke="#93c5fd" stroke-width="5" marker-end="url(#a)"/>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#bfdbfe">The planner may correctly prefer a sequential scan. Optimize total cost, not the plan-node label.</text>
</svg>
