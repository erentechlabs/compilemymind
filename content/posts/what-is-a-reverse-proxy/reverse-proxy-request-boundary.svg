<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Reverse proxy request flow and trust boundary</title>
  <desc id="desc">A browser sends HTTPS to a public reverse proxy. The proxy terminates TLS, validates and routes the request, establishes trusted forwarding context, then connects to one of three private backends. The response returns through the same boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="proxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="800" height="1180" rx="28" fill="url(#background)"/>
  <text x="400" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a">The reverse proxy boundary</text>
  <text x="400" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">One public contract, deliberate routing, private backends</text>

  <g filter="url(#shadow)">
    <rect x="120" y="118" width="560" height="126" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <rect x="164" y="153" width="92" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="175" y="164" width="70" height="36" rx="4" fill="#ffffff"/>
  <circle cx="181" cy="171" r="3" fill="#2563eb"/>
  <circle cx="191" cy="171" r="3" fill="#0f766e"/>
  <text x="292" y="174" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Client</text>
  <text x="292" y="205" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Requests app.example.com</text>

  <path d="M400 244 V310" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="426" y="260" width="168" height="36" rx="18" fill="#dbeafe"/>
  <text x="510" y="283" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HTTPS request</text>

  <g filter="url(#shadow)">
    <rect x="72" y="326" width="656" height="438" rx="30" fill="url(#proxy)"/>
  </g>
  <text x="400" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Reverse proxy</text>
  <text x="400" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#dbeafe">Public endpoint and policy boundary</text>

  <rect x="122" y="430" width="556" height="68" rx="15" fill="#ffffff" fill-opacity="0.97"/>
  <circle cx="166" cy="464" r="18" fill="#dbeafe"/>
  <text x="166" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">1</text>
  <text x="204" y="458" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Accept and inspect</text>
  <text x="204" y="482" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Terminate TLS • validate host • apply limits</text>

  <rect x="122" y="518" width="556" height="68" rx="15" fill="#ffffff" fill-opacity="0.97"/>
  <circle cx="166" cy="552" r="18" fill="#ccfbf1"/>
  <text x="166" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">2</text>
  <text x="204" y="546" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Match and route</text>
  <text x="204" y="570" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Choose a configured upstream from host and path</text>

  <rect x="122" y="606" width="556" height="68" rx="15" fill="#ffffff" fill-opacity="0.97"/>
  <circle cx="166" cy="640" r="18" fill="#fef3c7"/>
  <text x="166" y="646" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">3</text>
  <text x="204" y="634" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Establish trusted context</text>
  <text x="204" y="658" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Set forwarded scheme, host, and client chain</text>

  <rect x="122" y="694" width="556" height="44" rx="14" fill="#0f172a" fill-opacity="0.25"/>
  <text x="400" y="721" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" fill="#ffffff">Optional: authenticate • rate-limit • cache • observe</text>

  <path d="M400 764 V830" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="426" y="780" width="212" height="36" rx="18" fill="#ccfbf1"/>
  <text x="532" y="803" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">new upstream connection</text>

  <g filter="url(#shadow)">
    <rect x="72" y="846" width="656" height="248" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="400" y="892" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Private backend network</text>
  <text x="400" y="920" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Only configured destinations should be reachable</text>

  <rect x="112" y="958" width="170" height="86" rx="15" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <circle cx="140" cy="986" r="11" fill="#16a34a"/>
  <text x="160" y="992" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Orders</text>
  <text x="197" y="1023" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">10.0.1.21:8080</text>

  <rect x="315" y="958" width="170" height="86" rx="15" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <circle cx="343" cy="986" r="11" fill="#16a34a"/>
  <text x="363" y="992" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Catalog</text>
  <text x="400" y="1023" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">10.0.1.22:8080</text>

  <rect x="518" y="958" width="170" height="86" rx="15" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <circle cx="546" cy="986" r="11" fill="#16a34a"/>
  <text x="566" y="992" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Accounts</text>
  <text x="603" y="1023" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">10.0.1.23:8080</text>

  <path d="M95 997 H47 V181 H115" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="24" y="548" width="142" height="40" rx="20" fill="#dbeafe" transform="rotate(-90 95 568)"/>
  <text x="95" y="574" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" transform="rotate(-90 95 568)">response returns</text>

  <rect x="72" y="1120" width="656" height="38" rx="19" fill="#e2e8f0"/>
  <text x="400" y="1144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">The proxy hides topology, but it also joins the security and correctness model.</text>
</svg>
