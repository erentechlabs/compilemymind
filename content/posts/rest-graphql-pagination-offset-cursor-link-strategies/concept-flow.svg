<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Offset, cursor, and link pagination</title>
  <desc id="desc">Offset pagination can drift after an insertion, while a composite cursor continues after a stable ordering boundary and a next link makes navigation discoverable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101729"/><stop offset="1" stop-color="#28356d"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#a5b4fc"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef2ff">Pagination defines continuity</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c7d2fe">Positions drift. A cursor remembers an ordering boundary. Links expose how to continue.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="170" width="496" height="220" rx="22" fill="#fff1f2"/>
    <text x="96" y="214" font-size="18" font-weight="700" fill="#be123c">OFFSET: POSITION MOVES</text>
    <text x="96" y="253" font-size="15" fill="#881337">Page 1</text>
    <g text-anchor="middle" font-size="18" font-weight="700" fill="#4c0519">
      <rect x="178" y="228" width="62" height="48" rx="9" fill="#fecdd3"/><text x="209" y="258">100</text>
      <rect x="250" y="228" width="62" height="48" rx="9" fill="#fecdd3"/><text x="281" y="258">99</text>
      <rect x="322" y="228" width="62" height="48" rx="9" fill="#fecdd3"/><text x="353" y="258">98</text>
    </g>
    <text x="96" y="323" font-size="15" fill="#881337">Insert 101, then OFFSET 3</text>
    <g text-anchor="middle" font-size="18" font-weight="700" fill="#4c0519">
      <rect x="300" y="300" width="62" height="48" rx="9" fill="#fda4af"/><text x="331" y="330">98</text>
      <rect x="372" y="300" width="62" height="48" rx="9" fill="#fecdd3"/><text x="403" y="330">97</text>
      <rect x="444" y="300" width="62" height="48" rx="9" fill="#fecdd3"/><text x="475" y="330">96</text>
    </g>
    <text x="96" y="371" font-size="14" font-weight="700" fill="#be123c">98 is duplicated</text>

    <rect x="640" y="170" width="496" height="220" rx="22" fill="#ecfdf5"/>
    <text x="672" y="214" font-size="18" font-weight="700" fill="#047857">CURSOR: CONTINUE AFTER BOUNDARY</text>
    <rect x="672" y="242" width="432" height="70" rx="14" fill="#d1fae5"/>
    <text x="888" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">(published_at, id) &lt; (:time, :id)</text>
    <text x="888" y="297" text-anchor="middle" font-size="14" fill="#047857">ORDER BY published_at DESC, id DESC</text>
    <text x="672" y="351" font-size="15" fill="#065f46">Tie-breaker makes the boundary unique.</text>
    <text x="672" y="375" font-size="15" fill="#065f46">Opaque token binds filters + version.</text>
  </g>

  <rect x="64" y="485" width="1072" height="118" rx="22" fill="#ffffff" fill-opacity=".09" stroke="#7281bf"/>
  <text x="96" y="527" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#a5b4fc">DISCOVERABLE NAVIGATION</text>
  <text x="96" y="570" font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#f8fafc">Link: &lt;/articles?first=20&amp;after=abc&gt;; rel="next"</text>
  <path d="M560 280 H625" stroke="#a5b4fc" stroke-width="5" marker-end="url(#a)"/>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#c7d2fe">Cursor pagination stabilizes continuation; it does not create a snapshot unless the API says so.</text>
</svg>
