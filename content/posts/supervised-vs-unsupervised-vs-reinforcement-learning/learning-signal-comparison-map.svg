<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1260" viewBox="0 0 760 1260" role="img" aria-labelledby="title desc">
  <title id="title">Learning signal comparison map</title>
  <desc id="desc">Three vertical paths compare supervised learning from labeled answers, unsupervised learning from structure in unlabeled data, and reinforcement learning from rewards after actions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subheading { font: 400 21px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .prompt { font: 700 25px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .card-title { font: 700 29px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { font: 700 17px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .body { font: 400 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
      .strong { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .example { font: 600 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="760" height="1260" rx="28" fill="#f8fafc"/>
  <text x="380" y="58" text-anchor="middle" class="heading">Choose the learning signal first</text>
  <text x="380" y="94" text-anchor="middle" class="subheading">What feedback does the problem provide?</text>

  <rect x="80" y="128" width="600" height="76" rx="20" fill="#1e293b" filter="url(#shadow)"/>
  <text x="380" y="176" text-anchor="middle" class="prompt">Answers, structure, or consequences?</text>
  <path d="M 380 204 L 380 235" class="line"/>

  <rect x="50" y="246" width="660" height="276" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="116" cy="312" r="34" fill="#0284c7"/>
  <text x="116" y="320" text-anchor="middle" class="label" fill="#ffffff">x → ŷ</text>
  <text x="172" y="307" class="card-title" fill="#075985">Supervised learning</text>
  <text x="172" y="341" class="label" fill="#0369a1">SIGNAL: LABELED ANSWERS</text>
  <line x1="84" y1="370" x2="676" y2="370" stroke="#7dd3fc" stroke-width="2"/>
  <text x="84" y="408" class="strong" fill="#075985">Learns</text>
  <text x="205" y="408" class="body">a mapping from features to a target</text>
  <text x="84" y="446" class="strong" fill="#075985">Produces</text>
  <text x="205" y="446" class="body">predictions for new examples</text>
  <rect x="84" y="470" width="592" height="36" rx="18" fill="#bae6fd"/>
  <text x="380" y="494" text-anchor="middle" class="example" fill="#075985">Example: predict a support ticket's priority</text>

  <path d="M 380 522 L 380 555" class="line"/>
  <rect x="50" y="566" width="660" height="276" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="116" cy="632" r="34" fill="#d97706"/>
  <circle cx="104" cy="624" r="6" fill="#fff7ed"/>
  <circle cx="128" cy="624" r="6" fill="#fff7ed"/>
  <circle cx="116" cy="644" r="6" fill="#fff7ed"/>
  <text x="172" y="627" class="card-title" fill="#92400e">Unsupervised learning</text>
  <text x="172" y="661" class="label" fill="#b45309">SIGNAL: UNLABELED EXAMPLES</text>
  <line x1="84" y1="690" x2="676" y2="690" stroke="#fcd34d" stroke-width="2"/>
  <text x="84" y="728" class="strong" fill="#92400e">Learns</text>
  <text x="205" y="728" class="body">useful structure or representations</text>
  <text x="84" y="766" class="strong" fill="#92400e">Produces</text>
  <text x="205" y="766" class="body">clusters, components, or density</text>
  <rect x="84" y="790" width="592" height="36" rx="18" fill="#fde68a"/>
  <text x="380" y="814" text-anchor="middle" class="example" fill="#92400e">Example: explore customer behavior groups</text>

  <path d="M 380 842 L 380 875" class="line"/>
  <rect x="50" y="886" width="660" height="276" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="116" cy="952" r="34" fill="#7c3aed"/>
  <path d="M 100 953 L 112 965 L 135 937" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="947" class="card-title" fill="#5b21b6">Reinforcement learning</text>
  <text x="172" y="981" class="label" fill="#6d28d9">SIGNAL: REWARDS AFTER ACTIONS</text>
  <line x1="84" y1="1010" x2="676" y2="1010" stroke="#c4b5fd" stroke-width="2"/>
  <text x="84" y="1048" class="strong" fill="#5b21b6">Learns</text>
  <text x="205" y="1048" class="body">a policy through interaction over time</text>
  <text x="84" y="1086" class="strong" fill="#5b21b6">Produces</text>
  <text x="205" y="1086" class="body">actions that maximize expected return</text>
  <rect x="84" y="1110" width="592" height="36" rx="18" fill="#ddd6fe"/>
  <text x="380" y="1134" text-anchor="middle" class="example" fill="#5b21b6">Example: learn a support scheduling policy</text>

  <text x="380" y="1218" text-anchor="middle" class="subheading">Define the feedback before choosing the algorithm.</text>
</svg>
