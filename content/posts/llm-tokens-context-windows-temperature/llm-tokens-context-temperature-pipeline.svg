<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" role="img" aria-labelledby="title desc">
  <title id="title">Tokens, context window, and temperature in one LLM generation cycle</title>
  <desc id="desc">A vertical three-stage diagram. Text is split into model-specific tokens, the tokens share a finite context budget, and temperature reshapes next-token probabilities before one selected token returns to the context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .panel{fill:#12263f;stroke:#36536f;stroke-width:2}.stage{font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#7dd3fc}.heading{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}.body{font:500 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#dbeafe}.small{font:500 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#bfd4ea}.label{font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e2e8f0}.chip{fill:#203b5a;stroke:#5e82a6;stroke-width:1.5}.flow{fill:none;stroke:#7dd3fc;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="920" height="980" rx="28" fill="url(#bg)"/>
  <text x="460" y="54" text-anchor="middle" class="heading">One generation cycle, three boundaries</text>
  <text x="460" y="84" text-anchor="middle" class="body">Representation → capacity → selection</text>

  <g filter="url(#shadow)">
    <rect class="panel" x="60" y="118" width="800" height="202" rx="22"/>
    <text x="92" y="154" class="stage">1 · TOKENS — REPRESENTATION</text>
    <text x="92" y="188" class="body">The tokenizer converts text into model-specific units.</text>
    <rect class="chip" x="92" y="218" width="164" height="54" rx="12"/>
    <text x="174" y="251" text-anchor="middle" class="label">“replaying now”</text>
    <path d="M275 245 H325" class="flow"/>
    <rect class="chip" x="348" y="218" width="76" height="54" rx="12"/>
    <rect class="chip" x="436" y="218" width="88" height="54" rx="12"/>
    <rect class="chip" x="536" y="218" width="66" height="54" rx="12"/>
    <rect class="chip" x="614" y="218" width="116" height="54" rx="12"/>
    <text x="386" y="251" text-anchor="middle" class="label">re</text>
    <text x="480" y="251" text-anchor="middle" class="label">play</text>
    <text x="569" y="251" text-anchor="middle" class="label">ing</text>
    <text x="672" y="251" text-anchor="middle" class="label"> now</text>
    <text x="92" y="299" class="small">Illustrative split: another tokenizer may divide the same text differently.</text>
  </g>

  <path d="M460 321 V357" class="flow"/>

  <g filter="url(#shadow)">
    <rect class="panel" x="60" y="370" width="800" height="244" rx="22"/>
    <text x="92" y="406" class="stage">2 · CONTEXT WINDOW — CAPACITY</text>
    <text x="92" y="440" class="body">Instructions, evidence, history, and output share a finite token budget.</text>
    <rect x="92" y="474" width="670" height="62" rx="12" fill="#0b1e33" stroke="#5e82a6" stroke-width="2"/>
    <path d="M96 478 H294 V532 H96 Z" fill="#38bdf8" opacity="0.88"/>
    <path d="M294 478 H506 V532 H294 Z" fill="#818cf8" opacity="0.88"/>
    <path d="M506 478 H650 V532 H506 Z" fill="#c084fc" opacity="0.88"/>
    <path d="M650 478 H758 V532 H650 Z" fill="#34d399" opacity="0.88"/>
    <text x="195" y="513" text-anchor="middle" class="label">history</text>
    <text x="400" y="513" text-anchor="middle" class="label">evidence</text>
    <text x="578" y="513" text-anchor="middle" class="label">prompt</text>
    <text x="704" y="513" text-anchor="middle" class="label">output</text>
    <path d="M762 466 V544" stroke="#fb7185" stroke-width="4"/>
    <text x="780" y="498" class="label">limit</text>
    <text x="780" y="521" class="small">model-specific</text>
    <text x="92" y="574" class="small">A larger window fits more tokens; it does not guarantee perfect use of every token.</text>
  </g>

  <path d="M460 615 V651" class="flow"/>

  <g filter="url(#shadow)">
    <rect class="panel" x="60" y="664" width="800" height="242" rx="22"/>
    <text x="92" y="700" class="stage">3 · TEMPERATURE — SELECTION</text>
    <text x="92" y="734" class="body">The model scores next tokens; temperature reshapes the distribution.</text>
    <text x="116" y="774" class="label">lower temperature</text>
    <rect x="116" y="792" width="250" height="18" rx="9" fill="#38bdf8"/>
    <rect x="116" y="820" width="88" height="18" rx="9" fill="#38bdf8" opacity="0.72"/>
    <rect x="116" y="848" width="36" height="18" rx="9" fill="#38bdf8" opacity="0.48"/>
    <text x="395" y="806" class="small">sharper</text>
    <text x="395" y="829" class="small">more focused</text>
    <text x="548" y="774" class="label">higher temperature</text>
    <rect x="548" y="792" width="186" height="18" rx="9" fill="#a78bfa"/>
    <rect x="548" y="820" width="128" height="18" rx="9" fill="#a78bfa" opacity="0.78"/>
    <rect x="548" y="848" width="92" height="18" rx="9" fill="#a78bfa" opacity="0.58"/>
    <text x="756" y="806" class="small">flatter</text>
    <text x="756" y="829" class="small">more varied</text>
    <text x="92" y="890" class="small">One token is selected, appended to context, and the cycle repeats.</text>
  </g>

  <path d="M460 908 V942 H148 V287" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="474" y="949" class="small">selected token returns to the sequence</text>
</svg>
