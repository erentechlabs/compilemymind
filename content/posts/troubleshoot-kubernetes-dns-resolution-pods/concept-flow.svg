<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Kubernetes DNS troubleshooting ladder</title>
  <desc id="desc">Troubleshooting moves from the pod resolver to the DNS Service and CoreDNS, then to the application Service, EndpointSlices, and backend pods.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#123e77"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#93c5fd"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#eff6ff">Find the first broken Kubernetes boundary</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#bfdbfe">DNS success does not prove Service routing or application health.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="190" width="180" height="140" rx="20" fill="#eff6ff"/>
    <text x="154" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">1 · POD</text>
    <text x="154" y="267" text-anchor="middle" font-size="15" fill="#1e3a8a">resolv.conf</text>
    <text x="154" y="293" text-anchor="middle" font-size="15" fill="#1e3a8a">short + FQDN</text>

    <rect x="286" y="190" width="180" height="140" rx="20" fill="#e0e7ff"/>
    <text x="376" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">2 · DNS VIP</text>
    <text x="376" y="267" text-anchor="middle" font-size="15" fill="#4338ca">UDP + TCP 53</text>
    <text x="376" y="293" text-anchor="middle" font-size="15" fill="#4338ca">NetworkPolicy</text>

    <rect x="508" y="190" width="180" height="140" rx="20" fill="#cffafe"/>
    <text x="598" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#0e7490">3 · COREDNS</text>
    <text x="598" y="267" text-anchor="middle" font-size="15" fill="#155e75">ready replicas</text>
    <text x="598" y="293" text-anchor="middle" font-size="15" fill="#155e75">logs + upstream</text>

    <rect x="730" y="190" width="180" height="140" rx="20" fill="#fef3c7"/>
    <text x="820" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">4 · SERVICE</text>
    <text x="820" y="267" text-anchor="middle" font-size="15" fill="#78350f">selector + ports</text>
    <text x="820" y="293" text-anchor="middle" font-size="15" fill="#78350f">cluster IP</text>

    <rect x="952" y="190" width="182" height="140" rx="20" fill="#dcfce7"/>
    <text x="1043" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">5 · BACKEND</text>
    <text x="1043" y="267" text-anchor="middle" font-size="15" fill="#166534">EndpointSlice</text>
    <text x="1043" y="293" text-anchor="middle" font-size="15" fill="#166534">readiness + app</text>
  </g>

  <path d="M244 260 H271 M466 260 H493 M688 260 H715 M910 260 H937" stroke="#93c5fd" stroke-width="5" marker-end="url(#a)"/>

  <rect x="64" y="455" width="1070" height="150" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#5c86b0"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="96" y="497" font-size="17" font-weight="700" fill="#93c5fd">SYMPTOM → NEXT BOUNDARY</text>
    <text x="96" y="539" font-size="16" fill="#f8fafc">NXDOMAIN → name, namespace, Service object</text>
    <text x="96" y="570" font-size="16" fill="#f8fafc">Timeout → pod-to-DNS path, policy, DNS health</text>
    <text x="610" y="539" font-size="16" fill="#f8fafc">Resolves + timeout → Service routing or policy</text>
    <text x="610" y="570" font-size="16" fill="#f8fafc">Resolves + HTTP 5xx → backend application</text>
  </g>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#bfdbfe">Compare a failing pod with a working pod before changing cluster-wide DNS configuration.</text>
</svg>
