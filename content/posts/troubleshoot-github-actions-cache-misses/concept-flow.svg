<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">GitHub Actions cache matching and save flow</title>
  <desc id="desc">The workflow searches for an exact key and version in accessible branch scope, then restore-key prefixes, then saves a new immutable cache after a successful job.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b111b"/><stop offset="1" stop-color="#26344d"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#a5b4fc"/></marker>
    <marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#4ade80"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">A cache match has three coordinates</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#cbd5e1">Visible key + internal version + accessible ref scope</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="64" y="184" width="242" height="156" rx="22" fill="#e0e7ff"/>
    <text x="185" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">LOOKUP INPUT</text>
    <text x="96" y="268" font-size="16" fill="#312e81">key: npm-Linux-a81...</text>
    <text x="96" y="296" font-size="16" fill="#312e81">path: ~/.npm</text>
    <text x="96" y="324" font-size="16" fill="#312e81">ref: refs/heads/main</text>

    <rect x="390" y="168" width="324" height="188" rx="22" fill="#f8fafc"/>
    <text x="552" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">MATCH ORDER</text>
    <circle cx="431" cy="249" r="18" fill="#4f46e5"/><text x="431" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="465" y="255" font-size="16" fill="#334155">exact key + version</text>
    <circle cx="431" cy="292" r="18" fill="#4f46e5"/><text x="431" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="465" y="298" font-size="16" fill="#334155">restore-key prefixes</text>
    <circle cx="431" cy="335" r="18" fill="#4f46e5"/><text x="431" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="465" y="341" font-size="16" fill="#334155">permitted default-branch scope</text>

    <rect x="798" y="168" width="336" height="188" rx="22" fill="#ecfdf5"/>
    <text x="966" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">RESULT</text>
    <rect x="832" y="239" width="126" height="70" rx="14" fill="#bbf7d0"/>
    <text x="895" y="269" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">EXACT</text>
    <text x="895" y="293" text-anchor="middle" font-size="14" fill="#166534">cache-hit=true</text>
    <rect x="974" y="239" width="126" height="70" rx="14" fill="#fef3c7"/>
    <text x="1037" y="269" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">PREFIX</text>
    <text x="1037" y="293" text-anchor="middle" font-size="14" fill="#92400e">not exact</text>
    <text x="966" y="337" text-anchor="middle" font-size="14" fill="#047857">otherwise: complete miss</text>
  </g>

  <path d="M306 262 H375" stroke="#a5b4fc" stroke-width="5" marker-end="url(#a)"/>
  <path d="M714 262 H783" stroke="#a5b4fc" stroke-width="5" marker-end="url(#a)"/>

  <rect x="64" y="475" width="1070" height="128" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#607089"/>
  <text x="96" y="516" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#86efac">MISS + SUCCESSFUL JOB</text>
  <text x="96" y="559" font-family="Inter,Arial,sans-serif" font-size="22" fill="#f8fafc">Post-job save creates a new immutable key</text>
  <text x="756" y="559" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cbd5e1">failed/cancelled job → may not save</text>
  <path d="M966 356 V460" stroke="#4ade80" stroke-width="5" marker-end="url(#g)"/>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">Expose the evaluated hash, ref, path, and inventory before deleting caches or changing keys.</text>
</svg>
