<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1060" role="img" aria-labelledby="title desc">
  <title id="title">AI training and inference lifecycle</title>
  <desc id="desc">The upper training loop transforms historical examples, performs forward and backward passes, and updates model parameters. A validated versioned model artifact crosses a release gate into inference, where live or batch inputs use fixed parameters to produce outputs. Monitored outcomes feed a later training cycle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="training" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="inference" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="violetArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .heading { font: 700 25px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .phase { font: 750 23px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .node { font: 650 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 520 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .badge { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .white-node { font: 650 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .white-small { font: 520 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="760" height="1060" rx="28" fill="url(#background)"/>
  <text x="380" y="48" text-anchor="middle" class="heading">The same model, two different phases</text>
  <text x="380" y="78" text-anchor="middle" class="small">Training changes parameters; inference uses a released version</text>

  <rect x="40" y="105" width="680" height="390" rx="28" fill="url(#training)" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="148" class="phase">Training</text>
  <rect x="526" y="121" width="164" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="608" y="146" text-anchor="middle" class="badge" fill="#1e3a8a">Parameters change</text>

  <rect x="72" y="192" width="174" height="72" rx="17" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="159" y="222" text-anchor="middle" class="node">Historical examples</text>
  <text x="159" y="247" text-anchor="middle" class="small">features · labels · objective</text>

  <line x1="246" y1="228" x2="298" y2="228" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>

  <rect x="306" y="192" width="148" height="72" rx="17" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" class="node">Forward pass</text>
  <text x="380" y="247" text-anchor="middle" class="small">current parameters</text>

  <line x1="454" y1="228" x2="506" y2="228" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>

  <rect x="514" y="192" width="174" height="72" rx="17" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="601" y="222" text-anchor="middle" class="node">Measure loss</text>
  <text x="601" y="247" text-anchor="middle" class="small">compare with objective</text>

  <line x1="601" y1="264" x2="601" y2="316" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>

  <rect x="430" y="314" width="258" height="90" rx="17" fill="#1d4ed8"/>
  <text x="559" y="345" text-anchor="middle" class="white-node">Backward pass</text>
  <text x="559" y="369" text-anchor="middle" class="white-node">+ optimizer update</text>
  <text x="559" y="391" text-anchor="middle" class="white-small">gradients change parameters</text>

  <path d="M 430 359 H 380 Q 326 359 326 305 V 278" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#blueArrow)"/>

  <rect x="72" y="324" width="196" height="76" rx="17" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="170" y="355" text-anchor="middle" class="node">Evaluate candidate</text>
  <text x="170" y="380" text-anchor="middle" class="small">held-out data · quality gates</text>
  <line x1="326" y1="308" x2="268" y2="348" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="204" y="430" width="352" height="112" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="380" y="465" text-anchor="middle" class="phase">Validated model artifact</text>
  <text x="380" y="493" text-anchor="middle" class="small">versioned parameters · preprocessing contract · metadata</text>
  <rect x="283" y="506" width="194" height="26" rx="13" fill="#ede9fe"/>
  <text x="380" y="524" text-anchor="middle" class="badge" fill="#5b21b6">Release decision</text>

  <line x1="380" y1="542" x2="380" y2="600" stroke="#7c3aed" stroke-width="4" marker-end="url(#violetArrow)"/>

  <rect x="40" y="610" width="680" height="330" rx="28" fill="url(#inference)" stroke="#15803d" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="653" class="phase">Inference</text>
  <rect x="526" y="626" width="164" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="608" y="651" text-anchor="middle" class="badge" fill="#166534">Parameters fixed</text>

  <rect x="72" y="704" width="174" height="72" rx="17" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="159" y="734" text-anchor="middle" class="node">New input</text>
  <text x="159" y="759" text-anchor="middle" class="small">live request or batch</text>

  <line x1="246" y1="740" x2="298" y2="740" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>

  <rect x="306" y="704" width="148" height="72" rx="17" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="380" y="734" text-anchor="middle" class="node">Forward pass</text>
  <text x="380" y="759" text-anchor="middle" class="small">released parameters</text>

  <line x1="454" y1="740" x2="506" y2="740" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>

  <rect x="514" y="704" width="174" height="72" rx="17" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="601" y="734" text-anchor="middle" class="node">Model output</text>
  <text x="601" y="759" text-anchor="middle" class="small">score · token · embedding</text>

  <rect x="146" y="824" width="468" height="76" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="380" y="855" text-anchor="middle" class="node">Serving + monitoring</text>
  <text x="380" y="880" text-anchor="middle" class="small">latency · errors · input drift · outcomes · model version</text>
  <line x1="601" y1="776" x2="601" y2="800" stroke="#15803d" stroke-width="3"/>
  <path d="M 601 800 H 380 V 816" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#greenArrow)"/>

  <path d="M 146 862 H 92 Q 62 862 62 832 V 228 H 64" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#violetArrow)"/>
  <rect x="76" y="956" width="608" height="68" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="380" y="984" text-anchor="middle" class="node">Feedback informs a future version</text>
  <text x="380" y="1008" text-anchor="middle" class="small">collect evidence → curate data → retrain → validate → release</text>
  <line x1="146" y1="900" x2="146" y2="948" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#violetArrow)"/>
  <text x="380" y="1045" text-anchor="middle" class="small">Production feedback does not silently rewrite the deployed model</text>
</svg>
