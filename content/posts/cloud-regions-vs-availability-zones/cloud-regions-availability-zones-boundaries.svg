<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cloud regions and availability zones as nested failure boundaries</title>
  <desc id="desc">Traffic enters a load balancer in Region A, which distributes requests across three availability zones. A zone outage affects only Zone B. A separate Region B contains disaster recovery capacity and backups for a larger regional failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="regionA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="regionB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .label { font: 700 24px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .zone-title { font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1e3a8a; }
      .node { font: 650 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 550 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="760" height="1000" rx="28" fill="url(#bg)"/>
  <text x="380" y="48" text-anchor="middle" class="label">Two boundaries, two failure scopes</text>
  <text x="380" y="78" text-anchor="middle" class="sub">Zones isolate local failures; regions isolate geographic failures</text>

  <rect x="40" y="110" width="680" height="600" rx="28" fill="url(#regionA)" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="152" class="label">Region A</text>
  <text x="70" y="180" class="sub">Primary geography · one regional service boundary</text>

  <rect x="235" y="205" width="290" height="66" rx="18" fill="#1d4ed8"/>
  <text x="380" y="235" text-anchor="middle" class="node white">Zone-aware load balancer</text>
  <text x="380" y="258" text-anchor="middle" class="small white">Routes only to healthy capacity</text>

  <line x1="310" y1="271" x2="166" y2="326" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="380" y1="271" x2="380" y2="326" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="271" x2="594" y2="326" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="68" y="330" width="196" height="262" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="166" y="368" text-anchor="middle" class="zone-title">Zone A</text>
  <text x="166" y="392" text-anchor="middle" class="small">isolated infrastructure</text>
  <rect x="96" y="424" width="140" height="58" rx="14" fill="#dbeafe"/>
  <text x="166" y="460" text-anchor="middle" class="node">App instance</text>
  <rect x="96" y="506" width="140" height="58" rx="14" fill="#dcfce7"/>
  <text x="166" y="542" text-anchor="middle" class="node">Data replica</text>

  <rect x="282" y="330" width="196" height="262" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="380" y="368" text-anchor="middle" class="zone-title" fill="#9a3412">Zone B</text>
  <text x="380" y="392" text-anchor="middle" class="small">local outage</text>
  <rect x="310" y="424" width="140" height="58" rx="14" fill="#fed7aa"/>
  <text x="380" y="460" text-anchor="middle" class="node">Unavailable</text>
  <rect x="310" y="506" width="140" height="58" rx="14" fill="#fed7aa"/>
  <text x="380" y="542" text-anchor="middle" class="node">Unavailable</text>
  <line x1="326" y1="414" x2="434" y2="574" stroke="#c2410c" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  <line x1="434" y1="414" x2="326" y2="574" stroke="#c2410c" stroke-width="7" stroke-linecap="round" opacity="0.72"/>

  <rect x="496" y="330" width="196" height="262" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="594" y="368" text-anchor="middle" class="zone-title">Zone C</text>
  <text x="594" y="392" text-anchor="middle" class="small">isolated infrastructure</text>
  <rect x="524" y="424" width="140" height="58" rx="14" fill="#dbeafe"/>
  <text x="594" y="460" text-anchor="middle" class="node">App instance</text>
  <rect x="524" y="506" width="140" height="58" rx="14" fill="#dcfce7"/>
  <text x="594" y="542" text-anchor="middle" class="node">Data replica</text>

  <rect x="126" y="620" width="508" height="60" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="160" cy="650" r="11" fill="#22c55e"/>
  <text x="184" y="657" class="node">Region stays available through one zone failure</text>

  <line x1="380" y1="712" x2="380" y2="778" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowViolet)"/>
  <rect x="454" y="722" width="216" height="44" rx="12" fill="#ffffff"/>
  <text x="562" y="750" text-anchor="middle" class="small">planned replication / failover</text>

  <rect x="40" y="790" width="680" height="170" rx="28" fill="url(#regionB)" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="834" class="label">Region B</text>
  <text x="70" y="862" class="sub">Separate geographic failure domain</text>

  <rect x="70" y="886" width="278" height="48" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="209" y="916" text-anchor="middle" class="node">Recovery capacity</text>
  <rect x="412" y="886" width="278" height="48" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="551" y="916" text-anchor="middle" class="node">Independent data copy</text>

  <text x="380" y="986" text-anchor="middle" class="small">A second region helps only when data, routing, capacity, and recovery are designed together</text>
</svg>
