<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
  <title id="title">The load-balancing decision loop</title>
  <desc id="desc">Client traffic enters a load balancer, which filters the backend pool by health, applies a routing policy, and forwards each request to a healthy server. Health results feed back into the next decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="balancer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="800" height="1100" rx="28" fill="url(#background)"/>
  <text x="400" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">The load-balancing decision loop</text>
  <text x="400" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Route with current health and policy—not a static server list</text>

  <g filter="url(#shadow)">
    <rect x="130" y="120" width="540" height="130" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <circle cx="205" cy="185" r="34" fill="#dbeafe"/>
  <circle cx="193" cy="177" r="7" fill="#2563eb"/>
  <circle cx="217" cy="177" r="7" fill="#2563eb"/>
  <path d="M179 203 Q205 219 231 203" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="275" y="177" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Clients</text>
  <text x="275" y="210" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Connect through one service address</text>

  <path d="M400 250 V294" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="426" y="258" width="118" height="34" rx="17" fill="#dbeafe"/>
  <text x="485" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">new traffic</text>

  <g filter="url(#shadow)">
    <rect x="90" y="310" width="620" height="350" rx="28" fill="url(#balancer)"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Load balancer</text>

  <rect x="140" y="392" width="520" height="66" rx="15" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="180" cy="425" r="17" fill="#dbeafe"/>
  <text x="180" y="431" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">1</text>
  <text x="215" y="433" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650" fill="#0f172a">Match listener and backend pool</text>

  <rect x="140" y="481" width="520" height="66" rx="15" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="180" cy="514" r="17" fill="#ccfbf1"/>
  <text x="180" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">2</text>
  <text x="215" y="522" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650" fill="#0f172a">Keep only healthy targets</text>

  <rect x="140" y="570" width="520" height="66" rx="15" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="180" cy="603" r="17" fill="#fef3c7"/>
  <text x="180" y="609" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">3</text>
  <text x="215" y="611" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650" fill="#0f172a">Apply routing policy</text>

  <path d="M400 660 V704" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="426" y="668" width="92" height="34" rx="17" fill="#dbeafe"/>
  <text x="472" y="690" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">forward</text>

  <g filter="url(#shadow)">
    <rect x="90" y="720" width="620" height="310" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="400" y="766" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Backend pool</text>

  <g>
    <rect x="145" y="790" width="510" height="62" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <circle cx="185" cy="821" r="15" fill="#16a34a"/>
    <path d="M178 821 l5 5 11 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="817" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">Server A</text>
    <text x="220" y="840" font-family="Inter, Arial, sans-serif" font-size="16" fill="#166534">healthy • eligible</text>
  </g>

  <g>
    <rect x="145" y="870" width="510" height="62" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="185" cy="901" r="15" fill="#dc2626"/>
    <path d="M179 895 l12 12 M191 895 l-12 12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="220" y="897" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">Server B</text>
    <text x="220" y="920" font-family="Inter, Arial, sans-serif" font-size="16" fill="#991b1b">unhealthy • removed from rotation</text>
  </g>

  <g>
    <rect x="145" y="950" width="510" height="62" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <circle cx="185" cy="981" r="15" fill="#16a34a"/>
    <path d="M178 981 l5 5 11 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="977" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">Server C</text>
    <text x="220" y="1000" font-family="Inter, Arial, sans-serif" font-size="16" fill="#166534">healthy • eligible</text>
  </g>

  <path d="M710 900 H754 V485 H715" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="643" y="663" width="130" height="40" rx="20" fill="#ccfbf1"/>
  <text x="708" y="688" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">health feedback</text>

  <rect x="90" y="1050" width="620" height="34" rx="17" fill="#e2e8f0"/>
  <text x="400" y="1072" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Health, pool membership, weights, and active load change the next decision.</text>
</svg>
