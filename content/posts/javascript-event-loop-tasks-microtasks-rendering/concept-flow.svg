<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Browser event-loop timeline</title>
  <desc id="desc">A browser runs one task to completion, drains microtasks including newly queued microtasks, may render, and then selects the next task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151515"/><stop offset="1" stop-color="#3f2b08"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#fde047"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#fefce8">One browser event-loop turn</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#fef08a">Run to completion → drain microtasks → rendering opportunity → next eligible task</text>

  <line x1="94" y1="392" x2="1110" y2="392" stroke="#fde047" stroke-width="5" marker-end="url(#a)"/>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="188" width="252" height="166" rx="22" fill="#fef9c3"/>
    <text x="196" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12">1 · CURRENT TASK</text>
    <text x="196" y="275" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">script / callback</text>
    <text x="196" y="311" text-anchor="middle" font-size="15" fill="#713f12">stack runs to completion</text>

    <rect x="374" y="160" width="300" height="194" rx="22" fill="#e0e7ff"/>
    <text x="524" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">2 · MICROTASK CHECKPOINT</text>
    <rect x="406" y="238" width="106" height="68" rx="13" fill="#c7d2fe"/>
    <rect x="534" y="238" width="106" height="68" rx="13" fill="#c7d2fe"/>
    <text x="459" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Promise</text>
    <text x="459" y="289" text-anchor="middle" font-size="13" fill="#4338ca">reaction</text>
    <text x="587" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Nested</text>
    <text x="587" y="289" text-anchor="middle" font-size="13" fill="#4338ca">microtask</text>
    <text x="524" y="333" text-anchor="middle" font-size="14" fill="#3730a3">drain until empty</text>

    <rect x="726" y="188" width="190" height="166" rx="22" fill="#dcfce7"/>
    <text x="821" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">3 · MAY RENDER</text>
    <rect x="773" y="263" width="96" height="54" rx="10" fill="#86efac"/>
    <text x="821" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">frame</text>

    <rect x="968" y="188" width="166" height="166" rx="22" fill="#fee2e2"/>
    <text x="1051" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">4 · NEXT TASK</text>
    <text x="1051" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#450a0a">timer</text>
    <text x="1051" y="305" text-anchor="middle" font-size="15" fill="#991b1b">or input / I/O</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">
    <text x="196" y="421" text-anchor="middle" fill="#fef08a">console 1, 2</text>
    <text x="524" y="421" text-anchor="middle" fill="#c7d2fe">console 3, 4</text>
    <text x="821" y="421" text-anchor="middle" fill="#bbf7d0">visual update possible</text>
    <text x="1051" y="421" text-anchor="middle" fill="#fecaca">console 5</text>
  </g>

  <rect x="70" y="500" width="506" height="108" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#8b7a3c"/>
  <text x="100" y="540" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#fef08a">STARVATION RISK</text>
  <text x="100" y="574" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fafafa">Microtasks that keep adding microtasks postpone tasks and rendering.</text>

  <rect x="624" y="500" width="510" height="108" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#8b7a3c"/>
  <text x="654" y="540" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#fef08a">HOST BOUNDARY</text>
  <text x="800" y="574" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fafafa">Node.js has host-specific phases.</text>
  <text x="64" y="672" font-family="Inter,Arial,sans-serif" font-size="15" fill="#fef08a">A zero-delay timer is eligible later; it never interrupts the current stack.</text>
</svg>
