<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Concurrency and parallelism timeline comparison</title>
  <desc id="desc">The top panel shows task A and task B taking turns on one worker. The bottom panel shows task A and task B running at the same time on two workers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="900" rx="32" fill="url(#bg)"/>
  <text x="400" y="52" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">Same time window, different execution</text>
  <text x="400" y="84" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle">Concurrency overlaps progress. Parallelism overlaps execution.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="120" width="720" height="315" rx="24" fill="#f8fafc"/>
    <rect x="40" y="465" width="720" height="375" rx="24" fill="#f8fafc"/>
  </g>

  <text x="75" y="170" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Concurrency: one worker</text>
  <text x="75" y="205" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Tasks take turns. Both advance; only one runs at an instant.</text>
  <text x="75" y="282" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Worker</text>
  <line x1="155" y1="276" x2="720" y2="276" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="170" y="241" width="130" height="70" rx="12" fill="#2563eb"/>
  <text x="235" y="284" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">A runs</text>
  <rect x="300" y="241" width="80" height="70" fill="#e2e8f0"/>
  <text x="340" y="284" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">wait</text>
  <rect x="380" y="241" width="130" height="70" rx="12" fill="#0d9488"/>
  <text x="445" y="284" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">B runs</text>
  <rect x="510" y="241" width="80" height="70" fill="#e2e8f0"/>
  <text x="550" y="284" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">wait</text>
  <rect x="590" y="241" width="115" height="70" rx="12" fill="#2563eb"/>
  <text x="648" y="270" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">A runs</text>
  <text x="648" y="293" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">again</text>
  <text x="170" y="346" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">earlier</text>
  <text x="705" y="346" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="end">later</text>
  <rect x="180" y="370" width="440" height="42" rx="21" fill="#e0e7ff"/>
  <text x="400" y="398" fill="#3730a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">INTERLEAVED EXECUTION</text>

  <text x="75" y="515" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Parallelism: two workers</text>
  <text x="75" y="550" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Separate workers execute tasks at the same time.</text>
  <text x="75" y="635" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Worker 1</text>
  <line x1="170" y1="629" x2="720" y2="629" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="205" y="594" width="390" height="70" rx="12" fill="#2563eb"/>
  <text x="400" y="637" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Task A runs</text>
  <text x="75" y="745" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Worker 2</text>
  <line x1="170" y1="739" x2="720" y2="739" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="205" y="704" width="390" height="70" rx="12" fill="#0d9488"/>
  <text x="400" y="747" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Task B runs</text>
  <line x1="205" y1="580" x2="205" y2="790" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/>
  <line x1="595" y1="580" x2="595" y2="790" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/>
  <rect x="190" y="793" width="420" height="42" rx="21" fill="#fef3c7"/>
  <text x="400" y="821" fill="#92400e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">SIMULTANEOUS EXECUTION</text>
</svg>
