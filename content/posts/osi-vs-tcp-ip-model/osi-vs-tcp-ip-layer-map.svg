<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">OSI and TCP/IP layer mapping</title>
  <desc id="desc">Seven OSI layers on the left connect approximately to four TCP/IP layers on the right. OSI Application, Presentation, and Session map to TCP/IP Application; Transport maps to Transport; Network maps to Internet; and Data Link plus Physical map to Link.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="960" rx="32" fill="url(#background)"/>
  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Two maps of the same network journey</text>
  <text x="600" y="105" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">OSI separates responsibilities; TCP/IP follows the Internet protocol suite</text>

  <text x="300" y="165" text-anchor="middle" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">OSI model · 7 layers</text>
  <text x="900" y="165" text-anchor="middle" fill="#5eead4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">TCP/IP model · 4 layers</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g fill="#1e3a8a" stroke="#60a5fa" stroke-width="2">
      <rect x="100" y="205" width="400" height="80" rx="14"/>
      <rect x="100" y="295" width="400" height="80" rx="14"/>
      <rect x="100" y="385" width="400" height="80" rx="14"/>
      <rect x="100" y="475" width="400" height="80" rx="14"/>
      <rect x="100" y="565" width="400" height="80" rx="14"/>
      <rect x="100" y="655" width="400" height="80" rx="14"/>
      <rect x="100" y="745" width="400" height="80" rx="14"/>
    </g>
    <g fill="#f8fafc" font-size="29" font-weight="650">
      <text x="125" y="255"><tspan fill="#93c5fd">7</tspan><tspan dx="26">Application</tspan></text>
      <text x="125" y="345"><tspan fill="#93c5fd">6</tspan><tspan dx="26">Presentation</tspan></text>
      <text x="125" y="435"><tspan fill="#93c5fd">5</tspan><tspan dx="26">Session</tspan></text>
      <text x="125" y="525"><tspan fill="#93c5fd">4</tspan><tspan dx="26">Transport</tspan></text>
      <text x="125" y="615"><tspan fill="#93c5fd">3</tspan><tspan dx="26">Network</tspan></text>
      <text x="125" y="705"><tspan fill="#93c5fd">2</tspan><tspan dx="26">Data Link</tspan></text>
      <text x="125" y="795"><tspan fill="#93c5fd">1</tspan><tspan dx="26">Physical</tspan></text>
    </g>

    <g fill="#134e4a" stroke="#2dd4bf" stroke-width="2">
      <rect x="700" y="205" width="400" height="260" rx="18"/>
      <rect x="700" y="475" width="400" height="80" rx="14"/>
      <rect x="700" y="565" width="400" height="80" rx="14"/>
      <rect x="700" y="655" width="400" height="170" rx="18"/>
    </g>
    <g fill="#f8fafc" text-anchor="middle">
      <text x="900" y="292" font-size="34" font-weight="700">Application</text>
      <text x="900" y="336" fill="#99f6e4" font-size="24">HTTP · DNS · TLS functions</text>
      <text x="900" y="375" fill="#99f6e4" font-size="24">encoding · session state</text>
      <text x="900" y="525" font-size="34" font-weight="700">Transport</text>
      <text x="900" y="615" font-size="34" font-weight="700">Internet</text>
      <text x="900" y="722" font-size="34" font-weight="700">Link</text>
      <text x="900" y="766" fill="#99f6e4" font-size="24">frames · signals · local medium</text>
    </g>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9">
    <path d="M515 245 C590 245 620 255 685 275"/>
    <path d="M515 335 C590 335 620 335 685 335"/>
    <path d="M515 425 C590 425 620 415 685 395"/>
    <path d="M515 515 C590 515 620 515 685 515"/>
    <path d="M515 605 C590 605 620 605 685 605"/>
    <path d="M515 695 C590 695 620 705 685 720"/>
    <path d="M515 785 C590 785 620 775 685 750"/>
  </g>

  <rect x="165" y="870" width="870" height="54" rx="27" fill="#0f172a" stroke="#475569"/>
  <text x="600" y="906" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">The mapping is approximate: real protocols can combine or cross functions.</text>
</svg>
