<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-text-collision-check="strict">
  <title id="title">Two Sum complement lookup</title>
  <desc id="desc">The algorithm scans the array, asks whether target minus the current value exists in a map, and either returns two indices or stores the value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#a5b4fc"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Two Sum: remember what you have seen</text>
  <text x="64" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c7d2fe">Target = 9 · invariant: the map contains only indices before the current index.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <text x="64" y="178" font-size="16" font-weight="700" fill="#a5b4fc">INPUT ARRAY</text>
    <rect x="64" y="198" width="112" height="102" rx="16" fill="#f8fafc"/>
    <rect x="190" y="198" width="112" height="102" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
    <rect x="316" y="198" width="112" height="102" rx="16" fill="#f8fafc"/>
    <rect x="442" y="198" width="112" height="102" rx="16" fill="#f8fafc"/>
    <g text-anchor="middle" fill="#111827" font-size="31" font-weight="700">
      <text x="120" y="255">2</text><text x="246" y="255">7</text><text x="372" y="255">11</text><text x="498" y="255">15</text>
    </g>
    <g text-anchor="middle" fill="#64748b" font-size="14">
      <text x="120" y="284">index 0</text><text x="246" y="284">index 1</text><text x="372" y="284">index 2</text><text x="498" y="284">index 3</text>
    </g>
  </g>

  <path d="M246 318 V383 H416" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="416" y="347" width="334" height="88" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#818cf8" stroke-width="2"/>
  <text x="583" y="380" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#c7d2fe">complement = target - value</text>
  <text x="583" y="414" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">9 - 7 = 2</text>

  <rect x="820" y="170" width="310" height="266" rx="22" fill="#f8fafc" filter="url(#shadow)"/>
  <text x="975" y="214" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#111827">Seen values → index</text>
  <line x1="854" y1="236" x2="1096" y2="236" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="862" y="264" width="96" height="62" rx="12" fill="#e0e7ff"/>
  <rect x="990" y="264" width="96" height="62" rx="12" fill="#dcfce7"/>
  <text x="910" y="303" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#312e81">2</text>
  <text x="1038" y="303" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">0</text>
  <text x="910" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">value</text>
  <text x="1038" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">index</text>
  <text x="975" y="401" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">Complement found</text>
  <path d="M750 391 H805" stroke="#a5b4fc" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="64" y="510" width="1066" height="116" rx="22" fill="#10b981" filter="url(#shadow)"/>
  <text x="100" y="555" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#052e26">RETURN THE TWO DIFFERENT INDICES</text>
  <text x="100" y="598" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">[0, 1]  →  nums[0] + nums[1] = 2 + 7 = 9</text>
  <text x="64" y="678" font-family="Inter,Arial,sans-serif" font-size="15" fill="#a5b4fc">Lookup before insert: expected O(n) time, O(n) additional space.</text>
</svg>
