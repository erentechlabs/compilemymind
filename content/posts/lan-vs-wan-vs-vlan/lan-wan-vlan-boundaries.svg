<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">How LAN, WAN, and VLAN boundaries relate</title>
  <desc id="desc">An office LAN contains employee and guest VLANs on shared switches. A router connects that LAN across a WAN to a separate branch LAN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="wan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#c4b5fd"/>
    </marker>
    <style>
      .title{font:700 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle}
      .subtitle{font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1;text-anchor:middle}
      .section{font:700 26px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .label{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle}
      .body{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#dbeafe;text-anchor:middle}
      .chip{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
      .small{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1;text-anchor:middle}
    </style>
  </defs>

  <rect width="800" height="1120" rx="32" fill="url(#bg)"/>
  <text x="400" y="62" class="title">One network journey, three boundaries</text>
  <text x="400" y="96" class="subtitle">VLANs divide the local switch fabric; the WAN joins separate LANs</text>

  <rect x="46" y="138" width="708" height="570" rx="28" fill="#0b2942" stroke="#38bdf8" stroke-width="3"/>
  <text x="76" y="181" class="section">OFFICE LAN</text>
  <text x="400" y="212" class="body">Locally operated switches, Wi-Fi, addressing, and policy</text>

  <rect x="78" y="244" width="296" height="300" rx="24" fill="#103b4c" stroke="#22d3ee" stroke-width="3"/>
  <rect x="94" y="262" width="116" height="32" rx="16" fill="#22d3ee"/>
  <text x="152" y="284" class="chip" fill="#083344">VLAN 10</text>
  <text x="226" y="329" class="label">Employees</text>
  <g fill="#67e8f9" stroke="#cffafe" stroke-width="2">
    <rect x="125" y="367" width="82" height="54" rx="6"/>
    <rect x="244" y="367" width="82" height="54" rx="6"/>
    <path d="M146 438h40m78 0h40" stroke-linecap="round"/>
  </g>
  <text x="226" y="477" class="body">10.10.10.0/24</text>
  <text x="226" y="509" class="small">One Layer 2 broadcast domain</text>

  <rect x="426" y="244" width="296" height="300" rx="24" fill="#41264f" stroke="#f472b6" stroke-width="3"/>
  <rect x="442" y="262" width="116" height="32" rx="16" fill="#f472b6"/>
  <text x="500" y="284" class="chip" fill="#500724">VLAN 30</text>
  <text x="574" y="329" class="label">Guests</text>
  <g fill="#f9a8d4" stroke="#fce7f3" stroke-width="2">
    <rect x="473" y="367" width="82" height="54" rx="6"/>
    <rect x="592" y="367" width="82" height="54" rx="6"/>
    <path d="M494 438h40m78 0h40" stroke-linecap="round"/>
  </g>
  <text x="574" y="477" class="body">10.10.30.0/24</text>
  <text x="574" y="509" class="small">Separate Layer 2 broadcast domain</text>

  <rect x="142" y="579" width="516" height="78" rx="18" fill="#163a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="610" class="label">Shared managed switch fabric</text>
  <text x="400" y="639" class="body">Access ports assign endpoints • trunks carry multiple VLANs</text>
  <path d="M226 544v35M574 544v35" stroke="#93c5fd" stroke-width="4"/>

  <rect x="226" y="683" width="348" height="76" rx="18" fill="#1d4ed8" stroke="#bfdbfe" stroke-width="3"/>
  <text x="400" y="715" class="label">Router / Layer 3 switch</text>
  <text x="400" y="743" class="body">Routes between networks under policy</text>

  <path d="M400 759v92" stroke="#c4b5fd" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="94" y="850" width="612" height="104" rx="52" fill="url(#wan)" stroke="#ddd6fe" stroke-width="3"/>
  <text x="400" y="892" class="label">WAN</text>
  <text x="400" y="923" class="body">Remote routing across carrier, tunnel, internet, or private transport</text>

  <path d="M400 954v49" stroke="#c4b5fd" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="180" y="1002" width="440" height="80" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
  <text x="400" y="1034" class="label">BRANCH LAN</text>
  <text x="400" y="1063" class="body">A separate local environment with its own VLANs</text>
</svg>
